- name: Install dependencies (Linux)
  if: matrix.os == 'ubuntu-latest'
  run: |
    sudo apt-get update
    sudo apt-get install -y build-essential cmake zip

- name: Install dependencies (macOS)
  if: matrix.os == 'macos-latest'
  run: |
    brew update
    brew install cmake zip

- name: Install dependencies (Windows)
  if: matrix.os == 'windows-latest'
  run: |
    choco install -y cmake zip --no-progress
  shell: cmd

- name: Configure with CMake
  run: |
    mkdir -p build
    cd build
    cmake .. -DCMAKE_BUILD_TYPE=Release
  shell: bash

- name: Build
  run: |
    cd build
    cmake --build . --config Release -- -j$(nproc || 2)
  shell: bash

- name: Package binary (Linux / macOS)
  if: matrix.os != 'windows-latest'
  run: |
    mkdir -p dist
    # adjust the executable name/path below to match your project
    if [ -f build/grepx-nexus-cpp ]; then
      cp build/grepx-nexus-cpp dist/grepx-nexus-cpp
    elif [ -f build/Release/grepx-nexus-cpp ]; then
      cp build/Release/grepx-nexus-cpp dist/grepx-nexus-cpp
    fi
    zip -j "dist/grepx-nexus-cpp-${{ github.ref_name }}-${{ matrix.os }}.zip" dist/grepx-nexus-cpp
  shell: bash

- name: Package binary (Windows)
  if: matrix.os == 'windows-latest'
  run: |
    mkdir dist 2>nul || exit 0
    powershell -Command ^
      $exe = (Test-Path build\\Release\\grepx-nexus-cpp.exe) ? 'build\\Release\\grepx-nexus-cpp.exe' : 'build\\grepx-nexus-cpp.exe'; ^
      Copy-Item $exe dist\\grepx-nexus-cpp.exe; ^
      Compress-Archive -Path dist\\grepx-nexus-cpp.exe -DestinationPath dist\\grepx-nexus-cpp-${{ github.ref_name }}-windows.zip -Force
  shell: powershell

- name: Create GitHub Release (only on tag)
  if: startsWith(github.ref, 'refs/tags/')
  id: create_release
  uses: softprops/action-gh-release@v1
  with:
    tag_name: ${{ github.ref_name }}
    name: Release ${{ github.ref_name }}
  env:
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

- name: Upload release asset (only on tag)
  if: startsWith(github.ref, 'refs/tags/')
  uses: actions/upload-release-asset@v1
  with:
    upload_url: ${{ steps.create_release.outputs.upload_url }}
    asset_path: dist/*.zip
    asset_name: grepx-nexus-cpp-${{ github.ref_name }}-${{ matrix.os }}.zip
    asset_content_type: application/zip
  env:
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

- name: Upload workflow artifact (non-tag / fallback)
  if: !startsWith(github.ref, 'refs/tags/')
  uses: actions/upload-artifact@v3
  with:
    name: grepx-nexus-cpp-${{ matrix.os }}
    path: dist/*.zip