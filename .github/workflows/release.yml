```yaml
name: CI / Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-package:
    name: Build & Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------
      # Install dependencies
      # -----------------------------

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake zip

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install cmake zip

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install -y cmake --no-progress
        shell: powershell

      # -----------------------------
      # Configure
      # -----------------------------

      - name: Configure with CMake
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
        shell: bash

      - name: Configure with CMake (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          New-Item -ItemType Directory -Path build -Force | Out-Null
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
        shell: powershell

      # -----------------------------
      # Build
      # -----------------------------

      - name: Build (Linux / macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cd build
          cmake --build . --config Release --parallel 2
        shell: bash

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd build
          cmake --build . --config Release --parallel 2
        shell: powershell

      # -----------------------------
      # Package Linux / macOS
      # -----------------------------

      - name: Package binary (Linux / macOS)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist

          if [ -f build/grepx-nexus-cpp ]; then
            cp build/grepx-nexus-cpp dist/grepx-nexus-cpp
          elif [ -f build/Release/grepx-nexus-cpp ]; then
            cp build/Release/grepx-nexus-cpp dist/grepx-nexus-cpp
          else
            echo "ERROR: grepx-nexus-cpp binary not found"
            find build -type f
            exit 1
          fi

          zip -j \
            "dist/grepx-nexus-cpp-${{ github.ref_name }}-${{ matrix.os }}.zip" \
            dist/grepx-nexus-cpp

        shell: bash

      # -----------------------------
      # Package Windows
      # -----------------------------

      - name: Package binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null

          if (Test-Path 'build\Release\grepx-nexus-cpp.exe') {
              $exe = 'build\Release\grepx-nexus-cpp.exe'
          }
          elseif (Test-Path 'build\grepx-nexus-cpp.exe') {
              $exe = 'build\grepx-nexus-cpp.exe'
          }
          else {
              Write-Error "ERROR: grepx-nexus-cpp.exe not found"
              Get-ChildItem -Path build -Recurse
              exit 1
          }

          Copy-Item $exe -Destination 'dist\grepx-nexus-cpp.exe' -Force

          Compress-Archive `
            -Path 'dist\grepx-nexus-cpp.exe' `
            -DestinationPath "dist\grepx-nexus-cpp-${{ github.ref_name }}-windows.zip" `
            -Force

        shell: powershell

      # -----------------------------
      # Upload build artifacts
      # -----------------------------

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: grepx-nexus-cpp-${{ matrix.os }}
          path: dist/*.zip

      # -----------------------------
      # Create GitHub Release
      # Only runs for version tags
      # -----------------------------

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```
