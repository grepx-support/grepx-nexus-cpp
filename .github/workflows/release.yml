name: CI / Release

on:
  push:
    tags:
      - 'v*'        # releases on tag pushes like v1.0.0
  push:
    branches:
      - main        # optional: run on pushes to main for testing
  workflow_dispatch: # allow manual runs

jobs:
  build-and-package:
    name: Build & Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake zip

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install cmake zip

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install -y cmake zip --no-progress
        shell: cmd

      - name: Configure with CMake
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
        shell: bash

      - name: Configure with CMake (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
        shell: powershell

      - name: Build (Linux / macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cd build
          cmake --build . --config Release -- -j$(nproc 2>/dev/null || echo 2)
        shell: bash

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd build
          cmake --build . --config Release -- /m:2
        shell: powershell

      - name: Package binary (Linux / macOS)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist
          # adjust the executable name/path below to match your project
          if [ -f build/grepx-nexus-cpp ]; then
            cp build/grepx-nexus-cpp dist/grepx-nexus-cpp
          elif [ -f build/Release/grepx-nexus-cpp ]; then
            cp build/Release/grepx-nexus-cpp dist/grepx-nexus-cpp
          fi
          zip -j "dist/grepx-nexus-cpp-${{ github.ref_name }}-${{ matrix.os }}.zip" dist/grepx-nexus-cpp
        shell: bash

      - name: Package binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $exe = if (Test-Path 'build\Release\grepx-nexus-cpp.exe') { 'build\Release\grepx-nexus-cpp.exe' } else { 'build\grepx-nexus-cpp.exe' }
          Copy-Item $exe -Destination 'dist\grepx-nexus-cpp.exe' -Force
          Compress-Archive -Path 'dist\grepx-nexus-cpp.exe' -DestinationPath "dist\grepx-nexus-cpp-${{ github.ref_name }}-windows.zip" -Force
        shell: powershell

      - name: Create GitHub Release (only on tag)
        if: startsWith(github.ref, 'refs/tags/')
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release asset (only on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/*.zip
          asset_name: grepx-nexus-cpp-${{ github.ref_name }}-${{ matrix.os }}.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload workflow artifact (non-tag / fallback)
        if: !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v3
        with:
          name: grepx-nexus-cpp-${{ matrix.os }}
          path: dist/*.zip
